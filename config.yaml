name: "FritzBox Network Guard"
version: "2.2.8"
slug: fritzbox_network_guard
description: >-
  LAN-Scan, FritzBox Packet-Capture (Wireshark-kompatibel), Traffic-Analyse &
  Visualisierung, Logs, Perimeter/Threat-Intel, WAN-Sperre über TR-064.
  Companion zu FRITZ!Portal.
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: application
boot: auto
host_network: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI
map:
  - type: share
    read_only: false
  - type: addon_config
    read_only: false
options:
  fritzbox_host: "fritz.box"
  fritzbox_user: ""
  fritzbox_password: ""
  scan_interval: 60
  network_cidr: "192.168.178.0/24"
  critical_mac_prefixes: ""
  auto_block_new_devices: false
  notify_on_block: true
  enable_perimeter_scan: true
  perimeter_interval: 3600
  enable_threat_intel: true
  threat_intel_interval: 21600
  auto_block_threat_intel: true
  deep_scan_on_new: false
  log_alert_notify: true
schema:
  fritzbox_host: str
  fritzbox_user: str
  fritzbox_password: password
  scan_interval: int(10,3600)
  network_cidr: str
  critical_mac_prefixes: str?
  auto_block_new_devices: bool
  notify_on_block: bool
  enable_perimeter_scan: bool
  perimeter_interval: int(300,86400)
  enable_threat_intel: bool
  threat_intel_interval: int(3600,86400)
  auto_block_threat_intel: bool
  deep_scan_on_new: bool
  log_alert_notify: bool
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: Network Guard
url: "https://github.com/Qlimuli/ha-fritzbox-network-guard"
