name: "FritzBox Network Guard"
version: "1.1.0"
slug: fritzbox_network_guard
description: >-
  Scans the local network for critical / suspicious devices.
  On security alerts the IP is placed on the FritzBox blacklist
  (WAN access blocked) and isolated. Blocked devices can be
  unlocked again via the add-on GUI.
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: application
boot: auto
host_network: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI for blocked devices & controls
map:
  - type: share
    read_only: false
  - type: addon_config
    read_only: false
options:
  fritzbox_host: "fritz.box"
  fritzbox_user: ""
  fritzbox_password: ""
  scan_interval: 60
  network_cidr: "192.168.178.0/24"
  critical_mac_prefixes: ""
  auto_block_new_devices: false
  notify_on_block: true
schema:
  fritzbox_host: str
  fritzbox_user: str
  fritzbox_password: password
  scan_interval: int(10,3600)
  network_cidr: str
  critical_mac_prefixes: str?
  auto_block_new_devices: bool
  notify_on_block: bool
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: Network Guard
url: "https://github.com/Qlimuli/ha-fritzbox-network-guard"
