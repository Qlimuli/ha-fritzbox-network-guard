<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>FritzBox Network Guard</title>
<style>
:root{
  --bg:#0b1220;--panel:#111827;--card:#1a2332;--border:#243044;
  --text:#e5eefb;--muted:#8b9bb4;--accent:#38bdf8;
  --ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--crit:#a855f7;
  --radius:12px;--touch:44px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;
  min-height:100%;min-height:100dvh;
  padding-bottom:calc(4.8rem + var(--safe-bottom));
}
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:.75rem;padding:calc(.9rem + var(--safe-top)) 1rem .9rem;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#121a2b,var(--bg));
  position:sticky;top:0;z-index:20;
}
header h1{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:.45rem}
header .sub{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.badge{font-size:.7rem;padding:.25rem .55rem;border-radius:999px;font-weight:600;white-space:nowrap}
.badge-ok{background:#14532d;color:#86efac}
.badge-warn{background:#78350f;color:#fcd34d}
.badge-danger{background:#7f1d1d;color:#fca5a5}
.badge-muted{background:#1e293b;color:var(--muted)}
.badge-crit{background:#4c1d95;color:#e9d5ff}
.badge-accent{background:#0c4a6e;color:#7dd3fc}

.tabs-desktop{display:none;gap:.35rem;padding:.5rem 1rem;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:.45rem .8rem;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--card);color:var(--accent)}
.tab:hover{color:var(--text)}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:#0f172a;border-top:1px solid var(--border);
  padding:0.25rem 0 calc(0.25rem + var(--safe-bottom));
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-item{
  flex:1 0 auto;min-width:4rem;display:flex;flex-direction:column;align-items:center;
  gap:.1rem;padding:.4rem .3rem;color:var(--muted);font-size:.62rem;font-weight:600;
  cursor:pointer;border:none;background:transparent;
}
.nav-item.active{color:var(--accent)}
.nav-item .ico{font-size:1.15rem;line-height:1}

.panel{display:none;padding:1rem 1rem 5rem}
.panel.active{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:1rem}
.stat,.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.85rem 1rem;
}
.stat .label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:1.35rem;font-weight:700;margin-top:.15rem}
.card h2,.card h3{font-size:.95rem;margin-bottom:.6rem;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn{
  background:var(--accent);color:#0b1220;border:none;padding:.55rem .9rem;
  border-radius:10px;font-weight:700;cursor:pointer;font-size:.85rem;
  min-height:var(--touch);touch-action:manipulation;
}
.btn:active{filter:brightness(.92)}
.btn-accent{background:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ok{background:var(--ok);color:#052e16}
.btn-sm{padding:.35rem .6rem;font-size:.78rem;min-height:auto}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
input,select{
  background:#0b1220;border:1px solid var(--border);color:var(--text);
  padding:.55rem .7rem;border-radius:8px;font-size:.9rem;min-height:var(--touch);
}
.pre{
  background:#0b1220;border:1px solid var(--border);border-radius:8px;
  padding:.75rem;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;
  white-space:pre-wrap;word-break:break-all;max-height:28rem;overflow:auto;
}
.empty{color:var(--muted);padding:1.5rem;text-align:center}
.muted{color:var(--muted);font-size:.85rem}
.toast{
  position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#e2e8f0;padding:.6rem 1.2rem;border-radius:999px;
  font-size:.85rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}

@media(min-width:800px){
  .bottom-nav{display:none}
  .tabs-desktop{display:flex}
  body{padding-bottom:1rem}
  .panel{padding:1.2rem 1.5rem 2rem}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🛡️ Network Guard <span class="badge badge-accent" id="ver-badge">2.2.4</span></h1>
    <div class="sub">FritzBox · LAN-Scan · Capture · Logs · Security</div>
  </div>
  <div id="status-badges" style="display:flex;gap:.35rem;flex-wrap:wrap"></div>
</header>

<div class="tabs-desktop" id="tabs-desktop">
  <div class="tab active" data-tab="overview">Übersicht</div>
  <div class="tab" data-tab="devices">Geräte</div>
  <div class="tab" data-tab="blocked">Gesperrt</div>
  <div class="tab" data-tab="security">Security</div>
  <div class="tab" data-tab="fritz">Fritz / Logs</div>
  <div class="tab" data-tab="capture">Traffic</div>
  <div class="tab" data-tab="whitelist">Whitelist</div>
  <div class="tab" data-tab="config">Einstellungen</div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="overview"><span class="ico">📊</span>Übersicht</button>
  <button class="nav-item" data-tab="devices"><span class="ico">💻</span>Geräte</button>
  <button class="nav-item" data-tab="blocked"><span class="ico">🚫</span>Gesperrt</button>
  <button class="nav-item" data-tab="security"><span class="ico">🔐</span>Security</button>
  <button class="nav-item" data-tab="fritz"><span class="ico">📡</span>Fritz</button>
  <button class="nav-item" data-tab="capture"><span class="ico">🧪</span>Traffic</button>
  <button class="nav-item" data-tab="whitelist"><span class="ico">✅</span>Whitelist</button>
  <button class="nav-item" data-tab="config"><span class="ico">⚙️</span>Config</button>
</nav>

<section class="panel active" id="panel-overview" data-panel="overview">
  <div class="grid" id="overview-stats"></div>
  <div class="card" style="margin-top:1rem">
    <h2>Letzte Security-Events</h2>
    <div id="overview-events" class="empty">Keine Events</div>
  </div>
  <div class="card">
    <h2>Schnellaktionen</h2>
    <div class="row">
      <button class="btn btn-accent" id="ov-scan">Force Scan</button>
      <button class="btn" id="ov-perimeter">Perimeter Scan</button>
      <button class="btn" id="ov-threat">Threat-Intel</button>
      <button class="btn" id="ov-deep">Deep LAN Scan</button>
    </div>
  </div>
</section>
