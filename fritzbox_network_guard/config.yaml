name: "FritzBox Network Guard"
version: "2.0.1"
slug: fritzbox_network_guard
description: >-
  LAN-Überwachung mit Lernmodus, Schutz vor Selbst-Aussperrung, WAN-Sperre
  über FritzBox TR-064 (X_AVM-DE_HostFilter), Risiko-Score und Audit-Log.
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: application
boot: auto
host_network: true
map:
  - type: share
    read_only: false
  - type: addon_config
    read_only: false
options:
  fritzbox_host: "fritz.box"
  fritzbox_user: ""
  fritzbox_password: ""
  fritzbox_use_https: true
  fritzbox_verify_tls: false
  mode: learning
  learning_days: 7
  scan_interval: 60
  network_cidr: "192.168.178.0/24"
  full_scan_interval_hours: 24
  critical_mac_prefixes: ""
  auto_block_new_devices: false
  whitelist_macs: ""
  whitelist_ips: ""
  max_blocks_per_cycle: 3
  dry_run: false
  notify_on_block: true
  notify_threshold: 40
  block_threshold: 70
  notify_service: "persistent_notification.create"
  api_token: ""
  enable_metrics: false
  enable_perimeter_scan: false
  enable_threat_intel: false
schema:
  fritzbox_host: str
  fritzbox_user: str
  fritzbox_password: password
  fritzbox_use_https: bool
  fritzbox_verify_tls: bool
  mode: list(learning|monitor|enforce)
  learning_days: int(1,90)
  scan_interval: int(10,3600)
  network_cidr: str
  full_scan_interval_hours: int(1,168)
  critical_mac_prefixes: str?
  auto_block_new_devices: bool
  whitelist_macs: str?
  whitelist_ips: str?
  max_blocks_per_cycle: int(1,50)
  dry_run: bool
  notify_on_block: bool
  notify_threshold: int(0,100)
  block_threshold: int(0,100)
  notify_service: str?
  api_token: password
  enable_metrics: bool
  enable_perimeter_scan: bool
  enable_threat_intel: bool
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: Network Guard
url: "https://github.com/Qlimuli/ha-fritzbox-network-guard"
